navigation_node:
  ros__parameters:
    # === Frame IDs ===
    global_frame: "map"
    odom_frame: "odom"
    robot_frame: "base_footprint"
    scan_topic: "/scan_multi"
    map_topic: "/map"

    # === Robot Geometry ===
    robot_radius: 0.45
    robot_width: 0.70
    robot_length: 0.90

    # === Costmap ===
    costmap_resolution: 0.05
    inscribed_radius: 0.45
    inflation_radius: 0.75
    cost_scaling_factor: 3.0
    obstacle_range: 5.0
    raytrace_range: 6.0

    # === Global Planner ===
    allow_unknown: false
    planner_frequency: 1.0
    replan_frequency: 0.2

    # === Local Planner ===
    lookahead_distance: 0.35
    lookahead_gain: 0.3
    min_lookahead: 0.30
    max_lookahead: 0.80
    max_linear_vel: 0.4
    min_linear_vel: 0.05
    max_angular_vel: 1.0
    goal_tolerance_xy: 0.25
    goal_tolerance_yaw: 0.30
    controller_frequency: 20.0

    # === Rotate in place ===
    rotate_in_place_enter_angle: 1.0
    rotate_in_place_exit_angle: 0.30
    goal_slowdown_distance: 1.20
    final_yaw_align_gain: 1.5
    min_rotate_speed: 0.15
    front_obstacle_half_angle: 0.35

    # === Curvature speed scaling ===
    curvature_low_threshold: 0.1
    curvature_high_threshold: 1.5
    curvature_min_scale: 0.4

    # === Safety ===
    emergency_stop_distance: 0.20
    slowdown_distance: 1.20

    # === Recovery execution ===
    recovery_backup_dist: 0.18
    recovery_backup_vel: -0.08
    recovery_spin_angle: 0.785398
    recovery_spin_vel: 0.35

    # === Recovery policy ===
    max_recovery_attempts: 2
    recovery_near_goal_distance: 0.80
    recovery_very_near_goal_distance: 0.35
    recovery_oscillation_ignore_distance: 0.80
    disable_replan_near_goal_distance: 0.90
    recovery_backup_timeout: 1.8
    recovery_spin_timeout: 2.5

    # === Stuck detection ===
    stuck_timeout: 6.0
    stuck_velocity_threshold: 0.02
    stuck_distance_threshold: 0.05
    stuck_yaw_threshold: 0.15

    # === Oscillation detection ===
    oscillation_timeout: 20.0
    oscillation_distance: 0.10

    # === RPP: Regulated Pure Pursuit ===
    regulated_linear_scaling_min_radius: 0.9
    regulated_linear_scaling_min_speed: 0.25
    use_arc_collision_check: true
    arc_check_samples: 6
    arc_check_robot_radius: 0.45

    # === Localization gating ===
    amcl_cov_x_threshold: 0.05
    amcl_cov_y_threshold: 0.05
    amcl_cov_yaw_threshold: 0.10
    localization_min_samples: 5
    costmap_warmup_cycles: 3
    amcl_pose_timeout: 2.0

amcl:
  ros__parameters:
    num_particles: 1000
    sigma_hit: 0.1
    z_hit: 0.95
    z_rand: 0.05
    laser_max_range: 10.0
    laser_skip: 5
    alpha1: 0.05
    alpha2: 0.03
    alpha3: 0.05
    alpha4: 0.02
    random_particle_ratio: 0.01
    robot_frame: "base_footprint"
